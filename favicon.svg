<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 6 alternating triangular facets -->
  <polygon points="16,16 16,2 28,9"  fill="#FFFFFF"/>
  <polygon points="16,16 28,9 28,23" fill="#1B3A8B"/>
  <polygon points="16,16 28,23 16,30" fill="#FFFFFF"/>
  <polygon points="16,16 16,30 4,23" fill="#1B3A8B"/>
  <polygon points="16,16 4,23 4,9"   fill="#FFFFFF"/>
  <polygon points="16,16 4,9 16,2"   fill="#1B3A8B"/>

  <!-- Black structural edges -->
  <g fill="none" stroke="#0A0A0A" stroke-width="1" stroke-linejoin="miter">
    <polygon points="16,2 28,9 28,23 16,30 4,23 4,9"/>
    <path d="M16,2 L16,16 M28,9 L16,16 M28,23 L16,16 M16,30 L16,16 M4,23 L16,16 M4,9 L16,16"/>
  </g>
</svg>
